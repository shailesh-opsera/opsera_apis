opencollection: 1.0.0

info:
  name: Opsera Public APIs
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"

docs:
  content: |-
    Opsera Public API collection covering all v1 and v2 endpoints.

    Uses {{baseUrl_publicApi}} as the base URL and inherits Bearer token authentication.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
