info:
  name: Get Pipeline Status
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v1/pipeline/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "pipelineId": "",
          "runCount": 1
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
