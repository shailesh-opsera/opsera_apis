info:
  name: Analyze Files
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/salesforce/analyze/files"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "filePaths": [
            "force-app/main/default/classes/AccountController.cls",
            "force-app/main/default/objects/Account/fields/CustomField__c.field-meta.xml"
          ],
          "sourceDirectory": "force-app/main/default"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
