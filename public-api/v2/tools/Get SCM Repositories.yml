info:
  name: Get SCM Repositories
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/tools/scm/repositories"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "tool_id": "<toolId>",
          "service": "github",
          "workspace": "my-workspace",
          "searchTerm": "api",
          "pageSize": 100,
          "currentPage": 1
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
