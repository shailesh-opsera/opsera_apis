info:
  name: Get User by Email Search
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl_publicApi}}/api/v2/usermanagement/user"
  params:
    - name: search
      value: email=user.name@company.com
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
