info:
  name: Add Group Members
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl_publicApi}}/api/v2/usermanagement/group/<groupName>/members"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
          "user.name@company.com",
          "another.user@company.com"
        ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
