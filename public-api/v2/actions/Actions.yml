      value: application/json
  body:
    type: json
    data: |-
      {
          "action": "status",
          "type": "pipeline",
          "version": 1,
          "target": [
            ""
          ]
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
