info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl_publicApi}}/api/v2/scim/v2/Users"
  params:
    - name: filter
      value: userName eq "user@example.com"
      type: query
      disabled: true
    - name: startIndex
      value: 1
      type: query
      disabled: true
    - name: count
      value: 100
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
