info:
  name: Search Groups
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/scim/v2/Groups/.search"
  headers:
    - name: Content-Type
      value: application/scim+json
  body:
    type: json
    data: |-
      {
          "filter": "displayName eq \"developers\"",
          "startIndex": 1,
          "count": 100
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
