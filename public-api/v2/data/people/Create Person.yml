info:
  name: Create Person
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/data/people"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "jd@opsera.io",
          "firstName": "John",
          "lastName": "Doe",
          "organization": "Opsera",
          "business": "Engineering",
          "department": "Platform",
          "group": "Phase 2",
          "team": "AOD"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
