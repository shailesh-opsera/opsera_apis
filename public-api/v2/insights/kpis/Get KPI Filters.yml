info:
  name: Get KPI Filters
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl_publicApi}}/api/v2/insights/kpis/filters"
  params:
    - name: kpis
      value: kpi-uuid-1,kpi-uuid-2
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
