info:
  name: Create Tool Mapping
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/insights/tool-mappings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "level_1": "Organization",
          "level_2": "Department",
          "level_3": "Team",
          "level_4": "",
          "level_5": "",
          "filtersData": [
            {
              "name": "repository_filter",
              "tool": "github",
              "values": ["repo1", "repo2"],
              "kpis": ["kpi-uuid-1"],
              "customFieldName": "custom_repo_field",
              "securityToolNames": [],
              "securityStepId": ""
            }
          ]
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
