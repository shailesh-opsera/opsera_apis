info:
  name: Create Filter
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl_publicApi}}/api/v2/insights/filters"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "mappingId": "<mappingId>",
          "tool": "github",
          "name": "repository_filter",
          "values": ["repo1", "repo2"],
          "kpis": ["kpi-uuid-1"],
          "custom_fieldName": "custom_repo_field",
          "labels": ["production"],
          "source": "user",
          "active": true,
          "sort_number": 1
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
