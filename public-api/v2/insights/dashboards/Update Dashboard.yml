info:
  name: Update Dashboard
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl_publicApi}}/api/v2/insights/dashboards/<id>"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "kpis": [
            "lead_time_for_changes",
            "deployment_frequency",
            "change_failure_rate"
          ],
          "filters": {
            "groups": ["team-alpha", "team-beta"],
            "level_1": ["bug", "feature"],
            "tools": {
              "github": ["main-app"],
              "jira": ["PROJ-123"]
            },
            "jiraProjectFilter": ["PROJ-123"],
            "repoFilter": ["main-app"]
          },
          "fromDate": "2025-01-01T00:00:00.000Z",
          "toDate": "2025-03-31T23:59:59.999Z",
          "rollingDays": 0
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
